<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
  <title>SonaAi</title>
  <meta name="description" content="SonaAi - Asisten cerdas dan elegan dengan interaksi suara dan cloud SQL.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <div class="app-layout" id="appLayout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <img src="logo.png" alt="SonaAi" class="brand-logo-img">
        </div>
        <button class="btn-icon" id="sidebarToggleBtn" title="Tutup Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <button class="btn-new-chat" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span>Obrolan Baru</span>
      </button>

      <div class="search-conv-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchConvInput" class="search-conv-input" placeholder="Cari obrolan..." autocomplete="off">
        <button type="button" class="btn-clear-search hidden" id="clearSearchBtn" title="Hapus pencarian">&times;</button>
      </div>

      <div class="conversations-wrapper">
        <div class="conversations-list" id="conversationsList">
          <div class="conv-skeleton">Memuat...</div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="db-status-badge" id="dbStatusBadge" title="Status Database">
          <span class="status-dot active" id="dbStatusDot"></span>
          <span class="status-text" id="dbStatusText">Cloud SQL: Connected</span>
        </div>

        <button class="btn-settings-trigger" id="openSettingsBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Pengaturan</span>
        </button>

        <div class="sidebar-version-badge" title="SonaAI Versi Awal">
          <span class="version-label">SonaAI</span>
          <span class="version-tag">v0.1</span>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-content">
      <!-- Top Bar -->
      <header class="top-nav">
        <div class="nav-left">
          <button class="btn-icon mobile-menu-btn" id="mobileMenuBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="active-conv-title" id="activeConvTitle">Obrolan Baru</div>
        </div>

        <div class="nav-right">
          <!-- Model Switcher -->
          <div class="model-picker-container">
            <label for="modelSelect" class="sr-only">Model</label>
            <select id="modelSelect" class="model-select">
              <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash-Lite (Cepat & Stabil)</option>
              <option value="gemini-3.8-flash">Gemini 3.8 Flash (Cerdas)</option>
              <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
              <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
            </select>
          </div>

          <!-- Export Chat Button -->
          <button class="btn-icon btn-export-chat" id="exportChatBtn" title="Ekspor Obrolan (.md)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span class="btn-text-export">Ekspor</span>
          </button>

          <!-- Voice Call Button -->
          <button class="btn-voice-call" id="startVoiceCallBtn" title="Buka Mode Suara">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            <span>Suara</span>
          </button>
        </div>
      </header>

      <!-- Chat Container -->
      <div class="chat-container" id="chatContainer">
        <!-- Minimalist Welcome Hero -->
        <div class="welcome-hero" id="welcomeHero">
          <div class="hero-logo-interactive-container" id="heroInteractiveLogo" title="Klik Sona untuk menyapa!">
            <img src="logo.png" alt="SonaAi" class="hero-logo-img" id="heroLogoImg">
          </div>
          <h1 class="hero-title">Ada yang bisa dibantu?</h1>

          <div class="minimal-prompts">
            <button class="prompt-chip" id="cardPromptVoice">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
              <span>Mode Suara</span>
            </button>
            <button class="prompt-chip" id="cardPromptCloud">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
              <span>Cloud SQL</span>
            </button>
            <button class="prompt-chip" id="cardPromptPro">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span>Tanya Apapun</span>
            </button>
          </div>
        </div>

        <!-- Messages Stream -->
        <div class="messages-stream" id="messagesStream"></div>
      </div>

      <!-- Live Speech Preview -->
      <div class="speech-preview-bar hidden" id="speechPreviewBar">
        <span class="speech-dot"></span>
        <span class="speech-preview-text" id="speechPreviewText">Mendengarkan...</span>
      </div>

      <!-- Input Area -->
      <footer class="input-area">
        <form class="input-form" id="chatForm">
          <button type="button" class="btn-input-action mic-btn" id="micBtn" title="Dikte Suara (Bicara untuk mengetik)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>

          <button type="button" class="btn-input-action web-search-toggle" id="webSearchBtn" title="Pencarian Web Google (Info Terkini)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span class="web-search-badge">Web</span>
          </button>

          <div class="textarea-wrapper">
            <textarea
              id="messageInput"
              class="message-textarea"
              placeholder="Ketik pesan untuk Sona..."
              rows="1"
              required
            ></textarea>
          </div>

          <button type="submit" class="btn-send" id="sendBtn" title="Kirim">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </form>
      </footer>
    </main>
  </div>

  <!-- Voice Call Overlay -->
  <div class="voice-call-overlay hidden" id="voiceCallOverlay">
    <div class="voice-call-header">
      <div class="voice-call-title">
        <img src="logo.png" alt="Sona" class="voice-header-logo">
      </div>
      <div class="voice-lang-pill-container" title="Pilih Bahasa Bicara">
        <button type="button" class="voice-lang-btn active" id="btnLangId" data-lang="id-ID">🇮🇩 ID</button>
        <button type="button" class="voice-lang-btn" id="btnLangEn" data-lang="en-US">🇺🇸 EN</button>
      </div>
      <button class="btn-icon close-call-btn" id="closeVoiceCallBtn" title="Tutup">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="voice-call-body">
      <div class="voice-orb-wrapper" id="voiceOrbWrapper" title="Ketuk orb untuk selesai bicara & kirim langsung">
        <!-- Intense Dual-Color Atmospheric Aura Glow -->
        <div class="orb-aura-glow" id="orbAuraGlow"></div>
        <!-- Floor Reflection Light Pool -->
        <div class="orb-floor-reflection"></div>
        <!-- Ambient Sonic Ripple Rings -->
        <div class="orb-ripple ring-1"></div>
        <div class="orb-ripple ring-2"></div>

        <!-- The Siri Cyan-Magenta Liquid Silk Crystal Sphere -->
        <div class="voice-orb" id="voiceOrb">
          <div class="silk-wave wave-cyan"></div>
          <div class="silk-wave wave-magenta"></div>
          <div class="silk-wave wave-center-fold"></div>
          <div class="silk-wave wave-glow-nucleus"></div>
          <div class="sphere-rim-cyan"></div>
          <div class="sphere-rim-magenta"></div>
          <div class="sphere-specular-top"></div>
          <div class="sphere-glass-glaze"></div>
          <!-- Floating particles (active during speaking) -->
          <div class="orb-particle" style="--rx:0.2"></div>
          <div class="orb-particle" style="--rx:0.7"></div>
          <div class="orb-particle" style="--rx:0.45"></div>
          <div class="orb-particle" style="--rx:0.85"></div>
          <div class="orb-particle" style="--rx:0.1"></div>
        </div>
      </div>

      <div class="voice-status-container">
        <div class="voice-status-badge stage-idle" id="voiceStatusBadge">
          <span class="voice-badge-dot"></span>
          <span class="voice-badge-text" id="voiceBadgeText">Tekan mic untuk berbicara</span>
        </div>
        <div class="voice-status-sub" id="voiceStatusSub">SonaAI siap mendengarkan</div>
        <div class="voice-soundwave-bars" id="voiceSoundwaveBars">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
      </div>

      <div class="voice-transcript-box" id="voiceTranscriptBox">
        <div class="transcript-line user-line" id="voiceUserTranscript"></div>
        <div class="transcript-line ai-line" id="voiceAiTranscript">"Halo, saya mendengarkan..."</div>
      </div>
    </div>

    <div class="voice-call-footer">
      <button class="call-control-btn mic-toggle-btn" id="callMicToggleBtn" title="Nyalakan / Matikan Mic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>

      <button type="button" class="call-action-btn send-now-btn" id="callSendNowBtn" title="Kirim Sekarang tanpa menunggu jeda hening">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <span>Kirim Sekarang</span>
      </button>

      <button class="call-control-btn interrupt-btn" id="callInterruptBtn" title="Jeda Bicara Sona">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>

      <button class="call-control-btn end-call-btn" id="callEndBtn" title="Selesai Telepon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop hidden" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <h3>Pengaturan</h3>
        </div>
        <button class="btn-icon" id="closeSettingsBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="apiKeyInput" class="form-label">
            <span>Google Gemini API Key</span>
          </label>
          <div class="input-with-action">
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="modal-input">
            <button type="button" class="btn-secondary" id="toggleApiKeyVisibility">Lihat</button>
          </div>
        </div>

        <div class="form-group">
          <label for="databaseUrlInput" class="form-label">
            <span>Cloud SQL Connection String (Supabase)</span>
          </label>
          <input
            type="password"
            id="databaseUrlInput"
            placeholder="postgresql://postgres.xxx:pass@pooler.supabase.com:6543/postgres"
            class="modal-input"
          >
        </div>

        <div class="form-group">
          <label class="form-label">Suara Sona</label>
          <div class="voice-config-grid">
            <div class="config-item">
              <div class="voice-picker-row">
                <select id="voiceSelect" class="modal-select">
                  <option value="">Default Voice</option>
                </select>
                <button type="button" class="btn-test-voice" id="testVoiceBtn" title="Dengarkan Suara">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                  <span>Tes Suara</span>
                </button>
              </div>
              <div class="voice-tip-hint">
                ✨ Rekomendasi cewek karir US: <strong>Samantha</strong> atau <strong>Victoria</strong>.
              </div>
            </div>
            <div class="config-item">
              <label for="voiceRate" class="label-sub">Kecepatan: <span id="voiceRateVal">1.0x</span></label>
              <input type="range" id="voiceRate" min="0.7" max="1.5" step="0.1" value="1.0">
            </div>
            <div class="config-item checkbox-item">
              <input type="checkbox" id="autoSpeakCheck">
              <label for="autoSpeakCheck">Otomatis bacakan suara balasan di mode chat (Opsional)</label>
            </div>
          </div>
        </div>

        <div id="settingsFeedback" class="settings-feedback hidden"></div>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" id="cancelSettingsBtn">Batal</button>
        <button class="btn-primary" id="saveSettingsBtn">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Live Code / Sandbox Preview Modal -->
  <div class="modal-overlay hidden" id="previewModal">
    <div class="modal-card preview-modal-card">
      <div class="modal-header">
        <div class="preview-title-wrap">
          <div class="preview-tag">Preview Sandbox</div>
          <h3 id="previewTitle" class="preview-title">Live Code Output</h3>
        </div>
        <button class="btn-icon" id="closePreviewBtn" title="Tutup">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="preview-modal-body">
        <iframe id="previewIframe" sandbox="allow-scripts" class="preview-iframe" title="Interactive Preview"></iframe>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
